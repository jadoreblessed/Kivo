services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SOLANA_MAINNET_RPC: ${NEXT_PUBLIC_SOLANA_MAINNET_RPC}
        NEXT_PUBLIC_SOLANA_DEVNET_RPC: ${NEXT_PUBLIC_SOLANA_DEVNET_RPC}
        NEXT_PUBLIC_KIVO_NETWORK: ${NEXT_PUBLIC_KIVO_NETWORK}
        NEXT_PUBLIC_KIVO_PROGRAM_ID: ${NEXT_PUBLIC_KIVO_PROGRAM_ID}
        NEXT_PUBLIC_KIVO_TREASURY: ${NEXT_PUBLIC_KIVO_TREASURY}
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      SOLANA_MAINNET_RPC: ${SOLANA_MAINNET_RPC}
      SOLANA_MARKET_RPC: ${SOLANA_MARKET_RPC}
      NEXT_PUBLIC_KIVO_NETWORK: ${NEXT_PUBLIC_KIVO_NETWORK}
      NEXT_PUBLIC_KIVO_PROGRAM_ID: ${NEXT_PUBLIC_KIVO_PROGRAM_ID}
      NEXT_PUBLIC_KIVO_TREASURY: ${NEXT_PUBLIC_KIVO_TREASURY}
      NEXT_PUBLIC_SOLANA_MAINNET_RPC: ${NEXT_PUBLIC_SOLANA_MAINNET_RPC}
      NEXT_PUBLIC_SOLANA_DEVNET_RPC: ${NEXT_PUBLIC_SOLANA_DEVNET_RPC}
    restart: unless-stopped
